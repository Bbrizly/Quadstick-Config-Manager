[workspace]
resolver = "2"
members = ["crates/qcm-config", "crates/qcm-core", "crates/qcm-testkit", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Bbrizly/Quadstick-Config-Manager"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
