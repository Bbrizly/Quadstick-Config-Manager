[package]
name = "qcm-core"
version = "0.1.0"
description = "QuadStick application core: errors, operations, confirmations and device ports"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# No Tauri, no OS crate, no network, no filesystem writer. The storage port is a
# trait; the adapter that touches a real volume lives outside this crate.
[dependencies]
qcm-config = { path = "../qcm-config" }
serde = { version = "1.0.229", features = ["derive"] }

# The session tests drive the ports through their fakes. A dev-dependency back
# on qcm-testkit is a cycle only in the test graph, which Cargo allows and which
# keeps the fakes in one place instead of a second copy living here.
[dev-dependencies]
qcm-testkit = { path = "../qcm-testkit" }
serde_json = "1.0.151"
