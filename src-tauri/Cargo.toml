[package]
name = "qcm-tauri"
version = "0.1.0"
description = "QuadStick Config Manager desktop shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "qcm_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.23.1"
# Local wall-clock time for the console's file stamp (write_file,2). Already in
# the lock through Tauri; `clock` is the only feature used.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
getrandom = "=0.4.3"
hidapi = { version = "=2.6.6", features = ["macos-shared-device", "windows-native"] }
# Tokens stay in the platform credential store on macOS and Windows. Linux
# keeps the token for the run only, the Avalonia `InMemoryTokenStore`
# fallback: Secret Service would need keyring's dbus features (libdbus) or its
# async ones (a second zbus major), and no persistent Linux store is in the
# product contract yet.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
open = "=5.4.3"
qcm-config = { path = "../crates/qcm-config" }
qcm-core = { path = "../crates/qcm-core" }
# All HTTP is native. Blocking is deliberate: commands run native work and the
# domain crates stay runtime-free; response bodies are explicitly bounded.
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls", "form", "json", "query"] }
rfd = "=0.17.2"
# The QuadStick console over Bluetooth SPP or a 3.3V serial cable. No libudev:
# Linux enumerates from sysfs, so the build needs no system library.
serialport = { version = "=4.10.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
# `qcm://profile/<id>` links: registration, macOS Apple-event delivery, and
# handing a second launch's link to the running app. The last releases that
# accept tauri 2.11 (2.5+/2.6+ need 2.12). No window permission is granted.
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-single-instance = { version = "=2.4.5", features = ["deep-link"] }

# Windows `MyDocuments` is the Documents known folder (OneDrive moves it), as
# .NET resolves it. Already in the lock through Tauri.
[target.'cfg(windows)'.dependencies]
dirs = "=6.0.0"

[dev-dependencies]
qcm-testkit = { path = "../crates/qcm-testkit" }
