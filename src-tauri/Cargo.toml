[package]
name = "qcm-tauri"
version = "0.1.0"
description = "QuadStick Config Manager desktop shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "qcm_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
hidapi = { version = "=2.6.6", features = ["macos-shared-device", "windows-native"] }
# Tokens stay in the platform credential store on the two desktop platforms
# where the shipping Google feature is enabled. Linux remains intentionally
# unconfigured until a persistent store is part of the product contract.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
open = "=5.4.3"
qcm-config = { path = "../crates/qcm-config" }
qcm-core = { path = "../crates/qcm-core" }
# All HTTP is native. Blocking is deliberate: commands run native work and the
# domain crates stay runtime-free; response bodies are explicitly bounded.
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls", "form", "json", "query"] }
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }

[dev-dependencies]
qcm-testkit = { path = "../crates/qcm-testkit" }
