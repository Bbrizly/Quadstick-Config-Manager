name: TASK-038 apply shortcut fix

on:
  push:
    branches:
      - rewrite/task38-editor

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply transform
        run: python3 tools/task38_fix_shortcut.py
      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/task38-apply-shortcut-fix.yml tools/task38_fix_shortcut.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/editor/EditorWorkspace.tsx
          git diff --cached --check
          git commit -m "fix(rewrite): make editor undo read canonical revision"
          git push origin HEAD:rewrite/task38-editor
