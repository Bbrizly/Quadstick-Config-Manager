name: Rewrite parity

on:
  push:
    branches:
      - "rewrite/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QSCM_TELEMETRY: "0"

permissions:
  contents: read

concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate0:
    name: Gate 0 / legacy + fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify fixture manifest
        run: python3 tools/fixtures/manifest.py verify
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Legacy tests stay green
        run: dotnet test QuadStick.sln --nologo -c Release
