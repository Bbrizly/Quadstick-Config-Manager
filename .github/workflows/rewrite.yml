name: Rewrite dependency lock refresh

on:
  push:
    branches:
      - "rewrite/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rewrite-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    name: Refresh Cargo.lock for rewrite dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Refresh lockfile
        run: cargo +1.98.0 generate-lockfile
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(rewrite): refresh Cargo.lock for workbook import"
          git push origin "HEAD:${GITHUB_REF_NAME}"
