name: Rewrite format workbook

on:
  push:
    branches:
      - "rewrite/task40-workbook-io"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rewrite-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format Rust workspace
        run: cargo +1.98.0 fmt --all
      - name: Commit formatting on rewrite branch only
        shell: bash
        run: |
          if git diff --quiet -- crates/qcm-config/src/workbook.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/qcm-config/src/workbook.rs
          git commit -m "style(rewrite): format workbook importer"
          git push origin HEAD:rewrite/task40-workbook-io
