name: Rewrite parity

on:
  push:
    branches:
      - "rewrite/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QSCM_TELEMETRY: "0"

permissions:
  contents: read

concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Legacy + oracle + Rust parity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Run complete differential parity gate
        run: python3 scripts/parity.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qcm-legacy-oracle-${{ github.sha }}
          path: fixtures/oracle/*
          if-no-files-found: warn
          retention-days: 14
