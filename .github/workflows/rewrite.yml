name: Rewrite parity

on:
  push:
    branches:
      - "rewrite/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QSCM_TELEMETRY: "0"

permissions:
  contents: read

concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate0:
    name: Gate 0 / legacy + oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify fixture manifest
        run: python3 tools/fixtures/manifest.py verify
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Legacy tests stay green
        run: dotnet test QuadStick.sln --nologo -c Release
      - name: Compile and self-check legacy parity oracle under two host cultures
        shell: bash
        run: |
          LANG=C dotnet run --project tools/QcmOracle/QcmOracle.csproj -c Release -- selfcheck
          LANG=fr_FR.UTF-8 dotnet run --project tools/QcmOracle/QcmOracle.csproj -c Release -- selfcheck
      - name: Generate canonical oracle fixture outputs
        run: dotnet run --project tools/QcmOracle/QcmOracle.csproj -c Release -- generate
      - name: Validate canonical outputs against parity schema
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 tools/oracle/validate.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qcm-legacy-oracle-${{ github.sha }}
          path: fixtures/oracle/*.json
          if-no-files-found: warn
          retention-days: 14

  rust-core:
    name: Rust core / fmt + clippy + test
    needs: gate0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy warnings are errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
