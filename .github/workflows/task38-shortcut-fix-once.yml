name: TASK-038 shortcut fix once

on:
  push:
    branches:
      - rewrite/task38-editor

permissions:
  contents: write

concurrency:
  group: task38-shortcut-fix-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Replace render-time refs with canonical read-before-undo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/features/editor/EditorWorkspace.tsx")
          text = path.read_text(encoding="utf-8")

          old_import = 'import { useCallback, useEffect, useMemo, useRef, useState } from "react";'
          new_import = 'import { useCallback, useEffect, useMemo, useState } from "react";'
          assert text.count(old_import) == 1, "expected useRef import exactly once"
          text = text.replace(old_import, new_import)

          refs = '''  const latestSnapshot = useRef(snapshot);\n  const operationBusy = useRef(false);\n  latestSnapshot.current = snapshot;\n'''
          assert text.count(refs) == 1, "expected render-time ref block exactly once"
          text = text.replace(refs, "")

          refresh = '''  const refreshAfterConflict = useCallback(
    async (reason: unknown): Promise<void> => {
      const error = asQcmError(reason);
      if (error.code !== ERROR_CODES.profileRevisionConflict) {
        showFailure(error);
        return;
      }
      try {
        const current = await client.getProfileSnapshot(snapshot.sessionId);
        onSnapshot(current);
      } catch (refreshReason) {
        showFailure(refreshReason);
        return;
      }
      setMessage(localizedErrorMessage(error.payload, t));
    },
    [client, onSnapshot, showFailure, snapshot.sessionId, t],
  );

'''
          text, count = re.subn(
              r'  const refreshAfterConflict = useCallback\([\s\S]*?(?=  const apply = useCallback\()',
              refresh,
              text,
              count=1,
          )
          assert count == 1, "expected refreshAfterConflict block exactly once"

          apply = '''  const apply = useCallback(
    async (ops: readonly EditorOp[], after?: (next: EditorSnapshot) => void): Promise<void> => {
      if (busy || ops.length === 0) return;
      setBusy(true);
      try {
        const next = await client.applyEditorOps(snapshot.sessionId, snapshot.revision, ops);
        onSnapshot(next);
        setMessage("");
        after?.(next);
      } catch (reason) {
        await refreshAfterConflict(reason);
      } finally {
        setBusy(false);
      }
    },
    [busy, client, onSnapshot, refreshAfterConflict, snapshot.revision, snapshot.sessionId],
  );

'''
          text, count = re.subn(
              r'  const apply = useCallback\([\s\S]*?(?=  const setCell = useCallback\()',
              apply,
              text,
              count=1,
          )
          assert count == 1, "expected apply block exactly once"

          undo = '''  const undo = useCallback(async (): Promise<void> => {
    if (busy) return;
    setBusy(true);
    try {
      const current = await client.getProfileSnapshot(snapshot.sessionId);
      if (!current.canUndo) {
        onSnapshot(current);
        return;
      }
      const next = await client.undoEditor(current.sessionId, current.revision);
      onSnapshot(next);
      setMessage("");
    } catch (reason) {
      await refreshAfterConflict(reason);
    } finally {
      setBusy(false);
    }
  }, [busy, client, onSnapshot, refreshAfterConflict, snapshot.sessionId]);

'''
          text, count = re.subn(
              r'  const undo = useCallback\([\s\S]*?(?=  const save = useCallback\()',
              undo,
              text,
              count=1,
          )
          assert count == 1, "expected undo block exactly once"

          save = '''  const save = useCallback(async (): Promise<void> => {
    if (busy) return;
    setBusy(true);
    try {
      const receipt = snapshot.saveTarget === null
        ? await client.saveProfileAs(snapshot.sessionId, snapshot.revision)
        : await client.saveProfile(snapshot.sessionId, snapshot.revision);
      if (receipt === null) return;
      const next = await client.getProfileSnapshot(snapshot.sessionId);
      onSnapshot(next);
      setMessage(t("Main_SavedToSavePath", [receipt.name]));
    } catch (reason) {
      await refreshAfterConflict(reason);
    } finally {
      setBusy(false);
    }
  }, [busy, client, onSnapshot, refreshAfterConflict, snapshot, t]);

'''
          text, count = re.subn(
              r'  const save = useCallback\([\s\S]*?(?=  useEffect\(\(\) => \{)',
              save,
              text,
              count=1,
          )
          assert count == 1, "expected save block exactly once"

          assert "latestSnapshot" not in text
          assert "operationBusy" not in text
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/task38-shortcut-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/editor/EditorWorkspace.tsx
          git diff --cached --check
          git commit -m "fix(rewrite): make editor undo read canonical revision"
          git push origin HEAD:rewrite/task38-editor
