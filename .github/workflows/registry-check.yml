name: Registry validation

on:
  push:
    branches: [main]
    paths: ["registry/**", "tools/registry/**", "docs/profiles/**", ".github/workflows/registry-*.yml"]
  pull_request:
    branches: [main]
    paths: ["registry/**", "tools/registry/**", "docs/profiles/**", ".github/workflows/registry-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/registry/validate.mjs --check
