name: TASK-038 finalize once

on:
  push:
    branches:
      - rewrite/task38-editor

permissions:
  contents: write

concurrency:
  group: task38-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync current main localization sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          files=(
            Strings.resx
            Strings.ar.resx
            Strings.de.resx
            Strings.es.resx
            Strings.fr.resx
            Strings.hi.resx
            Strings.it.resx
            Strings.ja.resx
            Strings.ko.resx
            Strings.nl.resx
            Strings.pl.resx
            Strings.pt.resx
            Strings.zh-Hans.resx
            Strings.qps-ploc.resx
          )
          for file in "${files[@]}"; do
            git show "origin/main:src/QuadStick.App/${file}" > "src/QuadStick.App/${file}"
          done
          python3 tools/i18n/generate_frontend_catalogs.py
      - name: Fix TASK-038 frontend gate findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/features/editor/EditorWorkspace.tsx")
          text = path.read_text(encoding="utf-8")

          effect = '''  useEffect(() => {\n    if (selectedMode === null && profileModes[0] !== undefined) setSelectedSheet(profileModes[0].index);\n    if (selectedRow !== null && !rows.some((row) => row.row === selectedRow)) setSelectedRow(null);\n  }, [profileModes, rows, selectedMode, selectedRow]);\n\n'''
          assert text.count(effect) == 1, "expected stale-selection effect exactly once"
          text = text.replace(effect, "")

          old = 'next.modes.filter((mode) => mode.kind === "mode").at(-1)'
          assert text.count(old) == 1, "expected add-mode filter/at expression exactly once"
          text = text.replace(old, 'next.modes.findLast((mode) => mode.kind === "mode")')

          old = 'next.modes.filter((candidate) => candidate.kind === "mode").at(-1)'
          assert text.count(old) == 1, "expected duplicate-mode filter/at expression exactly once"
          text = text.replace(old, 'next.modes.findLast((candidate) => candidate.kind === "mode")')

          old = '<p className="editor-message" role="status">{message}</p>'
          assert text.count(old) == 1, "expected status paragraph exactly once"
          text = text.replace(old, '<output className="editor-message">{message}</output>')

          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply pinned Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
      - name: Verify generated state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/i18n/generate_frontend_catalogs.py
          git diff --check
          git diff --exit-code -- src/i18n/catalogs
      - name: Commit finalized generated state and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/task38-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/QuadStick.App/Strings*.resx \
            src/i18n/catalogs \
            src/features/editor/EditorWorkspace.tsx \
            crates/qcm-core/src/lib.rs \
            src-tauri/src/main.rs
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix(rewrite): finalize TASK-038 gate and localization sync"
          git push origin HEAD:rewrite/task38-editor
