name: TASK-039 wire visualizer once
on:
  push:
    branches: [rewrite/task39-visualizer]
    paths: [.github/workflows/task39-wire-once.yml]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rewrite/task39-visualizer
      - name: Wire visualizer into editor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/features/editor/EditorWorkspace.tsx')
          text = p.read_text()
          needle = 'import { useI18n } from "../../i18n";\n'
          assert needle in text
          text = text.replace(needle, needle + 'import { QuadStickVisualizer } from "../visualizer/QuadStickVisualizer";\n', 1)
          start = text.index('          <section className="bindings-panel" aria-labelledby="rows-title">')
          end = text.index('          <aside className="inspector-panel"', start)
          replacement = '''          <section className="bindings-panel" aria-labelledby="rows-title">
            <div className="panel-heading-row">
              <h2 id="rows-title">{t("Shell_Rows")}</h2>
              {selectedMode !== null ? (
                <button type="button" disabled={busy} aria-label={t("Shell_AddANewBindingRow")} onClick={() => void apply([{ op: "add_row", sheet: selectedMode.index }])}>
                  {t("Shell_AddRow")}
                </button>
              ) : null}
            </div>
            <QuadStickVisualizer
              client={client}
              rows={rows}
              selectedRow={selectedRow}
              modeName={selectedMode?.name ?? ""}
              modeNumber={selectedMode?.number ?? null}
              onSelectRow={setSelectedRow}
            />
            {activeRow !== null ? (
              <div className="row-actions">
                <button type="button" disabled={busy || rows[0]?.row === activeRow.row} aria-label={t("Review_MoveItEarlier")} onClick={() => void apply([{ op: "move_row", from: activeRow.row, to: activeRow.row - 1 }], () => setSelectedRow(activeRow.row - 1))}>↑</button>
                <button type="button" disabled={busy || rows.at(-1)?.row === activeRow.row} aria-label={t("Review_MoveItLater")} onClick={() => void apply([{ op: "move_row", from: activeRow.row, to: activeRow.row + 1 }], () => setSelectedRow(activeRow.row + 1))}>↓</button>
                <button type="button" disabled={busy} onClick={() => void apply([{ op: "delete_row", row: activeRow.row }], () => setSelectedRow(null))}>{t("Shell_Delete")}</button>
              </div>
            ) : null}
          </section>

'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text)

          v = Path('src/features/visualizer/QuadStickVisualizer.tsx')
          text = v.read_text()
          old = '''                    <button
                      type="button"
                      aria-pressed={selectedRow === row.row}
                      onClick={() => onSelectRow(row.row)}
                    >'''
          new = '''                    <button
                      type="button"
                      data-binding-row={row.row}
                      data-testid={`binding-row-${String(row.row)}`}
                      aria-pressed={selectedRow === row.row}
                      onClick={() => onSelectRow(row.row)}
                    >'''
          assert old in text
          v.write_text(text.replace(old, new, 1))

          css = Path('src/styles/editor.css')
          text = css.read_text()
          addition = r'''

/* TASK-039: photo-first QuadStick visualizer. Geometry is fixed LTR because it
   identifies physical hardware; surrounding labels and semantic lists still
   follow document direction. */
.quadstick-visualizer {
  min-width: 0;
  display: grid;
  gap: var(--qcm-space-md);
}

.visualizer-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--qcm-space-md);
}

.visualizer-header h2,
.visualizer-header p {
  margin: 0;
}

.visualizer-header p,
.practice-status {
  color: var(--qcm-text-secondary);
  font-size: var(--qcm-small-size);
}

.practice-toggle.active,
.visualizer-hotspot[aria-pressed="true"],
.semantic-parts button[aria-pressed="true"] {
  border-color: var(--qcm-accent);
  background: var(--qcm-selection-tint);
}

.visualizer-stage-scroll {
  min-width: 0;
  overflow: auto hidden;
  border-radius: var(--qcm-radius-panel);
}

.visualizer-stage {
  position: relative;
  max-width: 100%;
  margin-inline: auto;
  transform-origin: top center;
}

.quadstick-photo {
  position: absolute;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
}

.hotspot-line {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.hotspot-line line {
  stroke: var(--qcm-text-secondary);
  stroke-width: 2;
}

.hotspot-marker {
  position: absolute;
  width: 14px;
  height: 14px;
  border: 3px solid var(--qcm-text-secondary);
  border-radius: 50%;
  background: var(--qcm-surface);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2;
}

.hotspot-marker[data-active="true"] {
  outline: 4px solid var(--qcm-accent);
  outline-offset: 2px;
}

.visualizer-hotspot {
  position: absolute;
  z-index: 3;
  width: 116px;
  min-height: 68px;
  display: grid;
  gap: 2px;
  align-content: center;
  padding: var(--qcm-space-xs);
  text-align: center;
}

.visualizer-hotspot span,
.visualizer-extra-zones span,
.semantic-parts button span:last-child {
  color: var(--qcm-text-secondary);
  font-size: var(--qcm-small-size);
}

.visualizer-hotspot[data-live-active="true"] {
  outline: 3px solid var(--qcm-accent);
  outline-offset: 2px;
}

.live-word {
  font-weight: 700;
}

.live-stick-dot {
  position: absolute;
  z-index: 4;
  width: 16px;
  height: 16px;
  border: 3px solid var(--qcm-bg);
  border-radius: 50%;
  background: var(--qcm-accent);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.visualizer-extra-zones {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--qcm-space-sm);
}

.visualizer-extra-zones button {
  display: grid;
  gap: var(--qcm-space-xs);
  min-height: 64px;
  text-align: start;
}

.practice-status {
  min-height: 1.4em;
  margin: 0;
}

.semantic-parts {
  display: grid;
  gap: var(--qcm-space-md);
  padding-top: var(--qcm-space-sm);
  border-top: var(--qcm-hairline) solid var(--qcm-border);
}

.semantic-parts section,
.semantic-parts ul {
  display: grid;
  gap: var(--qcm-space-xs);
  margin: 0;
  padding: 0;
}

.semantic-parts h3 {
  margin: 0;
  font-size: var(--qcm-small-size);
  color: var(--qcm-text-secondary);
}

.semantic-parts li {
  list-style: none;
}

.semantic-parts button {
  width: 100%;
  min-height: 52px;
  display: grid;
  grid-template-columns: minmax(110px, .8fr) 1fr;
  gap: var(--qcm-space-sm);
  align-items: center;
  text-align: start;
}

@media (max-width: 1180px) {
  .visualizer-stage {
    transform: scale(.82);
    margin-bottom: -84px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .live-stick-dot,
  .visualizer-hotspot,
  .hotspot-marker {
    transition: none;
  }
}

@media (forced-colors: active) {
  .visualizer-hotspot[data-live-active="true"],
  .hotspot-marker[data-active="true"] {
    outline-color: Highlight;
  }
}
'''
          if '/* TASK-039: photo-first QuadStick visualizer.' not in text:
              css.write_text(text + addition)

          test = Path('src/features/visualizer/QuadStickVisualizer.test.tsx')
          test.write_text(r'''import { fireEvent, render, screen, waitFor } from "@testing-library/react";
import { useState } from "react";
import { describe, expect, it } from "vitest";

import { I18nProvider } from "../../i18n";
import { MockQcmClient, type LiveSnapshot } from "../../platform";
import { QuadStickVisualizer, type VisualizerBinding } from "./QuadStickVisualizer";

const rows: readonly VisualizerBinding[] = [
  { row: 4, cells: ["cross", "normal", "mp_left_sip", "", "", "", "", "", "", ""] },
  { row: 5, cells: ["left_joy_left", "normal", "left", "", "", "", "", "", "", ""] },
];

function Harness({ client }: { readonly client: MockQcmClient }) {
  const [selected, setSelected] = useState<number | null>(null);
  return (
    <I18nProvider initialPreference="en">
      <QuadStickVisualizer client={client} rows={rows} selectedRow={selected} modeName="Racing" modeNumber={1} onSelectRow={setSelected} />
      <output data-testid="selected">{selected}</output>
    </I18nProvider>
  );
}

describe("TASK-039 QuadStick visualizer", () => {
  it("selects the same binding through the photo hotspot and semantic list", () => {
    const client = new MockQcmClient();
    render(<Harness client={client} />);
    fireEvent.click(screen.getByRole("button", { name: /Left.*1 mapping/u }));
    expect(screen.getByTestId("selected")).toHaveTextContent("4");
    fireEvent.click(screen.getByTestId("binding-row-5"));
    expect(screen.getByTestId("selected")).toHaveTextContent("5");
  });

  it("owns one live subscription and clears the active joystick on stale", async () => {
    const client = new MockQcmClient();
    render(<Harness client={client} />);
    fireEvent.click(screen.getByRole("button", { name: /Joystick travel/u }));
    await waitFor(() => expect(client.liveListenerCount).toBe(1));
    const reading: LiveSnapshot = { seq: 1, atMillis: 1, status: { kind: "reading", product: "QuadStick", motion: { x: 0.8, y: 0, buttons: [] } } };
    client.emitLive(reading);
    await waitFor(() => expect(document.querySelector('[data-live-active="true"]')).not.toBeNull());
    client.emitLive({ seq: 2, atMillis: 2, status: { kind: "stale", product: "QuadStick" } });
    await waitFor(() => expect(document.querySelector('[data-live-active="true"]')).toBeNull());
  });

  it("supports arrow-key movement between photo hotspots", () => {
    const client = new MockQcmClient();
    render(<Harness client={client} />);
    const joystick = screen.getByRole("button", { name: /Joystick.*1 mapping/u });
    joystick.focus();
    fireEvent.keyDown(joystick, { key: "ArrowRight" });
    expect(document.activeElement).toHaveTextContent("Left");
  });
});
''')

          Path('.github/workflows/task39-wire-once.yml').unlink()
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "TASK-039 integrate visualizer and Practice Mode"
          git push origin HEAD:rewrite/task39-visualizer
