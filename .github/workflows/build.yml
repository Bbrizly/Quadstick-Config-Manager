name: CI

# Tests run on every push and PR. Pushing a version tag (vX.Y.Z) additionally
# builds a download for each platform and publishes a GitHub Release. The tag is
# the only thing you create; everything below is automatic.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No job in this workflow may report. Releases are built here, and a build
# machine's launches and crashes are not a user's.
env:
  QSCM_TELEMETRY: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the release job can write to the repo.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test QuadStick.sln --nologo

  # PR/test builds normally compile the safe placeholder credentials. Exercise
  # the generated-source path too so a namespace/path regression cannot wait
  # until a real version tag to break the release build.
  release-source-smoke:
    name: Release source smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Generate harmless provider sources
        shell: bash
        run: |
          cat > src/QuadStick.Infrastructure/Google/GoogleClient.Local.cs <<'EOF'
          namespace QuadStick.Infrastructure.Google;

          static class GoogleClient
          {
              public const string Id = "ci-smoke.apps.googleusercontent.com";
              public const string Secret = "ci-smoke";
          }
          EOF
          cat > src/QuadStick.Infrastructure/Telemetry/TelemetryToken.Local.cs <<'EOF'
          namespace QuadStick.Infrastructure.Telemetry;

          static class TelemetryToken
          {
              public const string Value = "ci-smoke";
          }
          EOF
      - name: Compile release source path
        run: dotnet build src/QuadStick.App/QuadStick.App.csproj -c Release --nologo

  # One self-contained download per platform, built only for v* tags.
  package:
    name: Package ${{ matrix.label }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   label: Windows-x64,        kind: windows }
          - { os: macos-latest,   rid: osx-arm64, label: macOS-AppleSilicon, kind: macos   }
          - { os: macos-latest,   rid: osx-x64,   label: macOS-Intel,        kind: macos   }
          - { os: ubuntu-latest,  rid: linux-x64, label: Linux-x64,          kind: linux   }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Real provider credentials are generated inside Infrastructure, the
      # assembly that owns Google auth. No source file is borrowed from App.
      - name: Google client from secrets
        shell: bash
        env:
          GID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GSECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GID" ] || [ -z "$GSECRET" ]; then
            echo "GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET repo secrets are not set." >&2
            echo "Add them in Settings > Secrets and variables > Actions, or remove this step to release without Google backup." >&2
            exit 1
          fi
          case "$GID$GSECRET" in (*[!A-Za-z0-9._-]*)
            echo "A Google client secret value has unexpected characters; refusing to write source." >&2
            exit 1
          esac
          cat > src/QuadStick.Infrastructure/Google/GoogleClient.Local.cs <<EOF
          namespace QuadStick.Infrastructure.Google;

          static class GoogleClient
          {
              public const string Id = "$GID";
              public const string Secret = "$GSECRET";
          }
          EOF

      - name: PostHog token from secrets
        shell: bash
        env:
          PHTOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          if [ -z "$PHTOKEN" ]; then
            echo "POSTHOG_PROJECT_TOKEN is not set; building with analytics disabled." >&2
            exit 0
          fi
          case "$PHTOKEN" in (*[!A-Za-z0-9_-]*)
            echo "POSTHOG_PROJECT_TOKEN has unexpected characters; refusing to write source." >&2
            exit 1
          esac
          cat > src/QuadStick.Infrastructure/Telemetry/TelemetryToken.Local.cs <<EOF
          namespace QuadStick.Infrastructure.Telemetry;

          static class TelemetryToken
          {
              public const string Value = "$PHTOKEN";
          }
          EOF

      - name: Publish
        shell: bash
        run: |
          EXTRA=""
          [ "${{ matrix.kind }}" = "macos" ] || \
            EXTRA="-p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true"
          dotnet publish src/QuadStick.App/QuadStick.App.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version="$VERSION" $EXTRA -o publish --nologo

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive publish/* "dist/QuadStickConfigManager-${{ matrix.label }}.zip"

      - name: Package (macOS)
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          scripts/make-macos-app.sh publish "$VERSION" "QuadStick Config Manager.app"
          ditto -c -k --keepParent "QuadStick Config Manager.app" \
            "dist/QuadStickConfigManager-${{ matrix.label }}.zip"

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          rm -f publish/*.pdb
          tar -C publish -czf "dist/QuadStickConfigManager-${{ matrix.label }}.tar.gz" .

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: QuadStick Config Manager ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Download the file for your computer, unzip, and run. No installer, works offline (except Sheets import, Drive backup, and optional usage data).

            | File | Computer |
            |------|----------|
            | `QuadStickConfigManager-Windows-x64.zip` | Windows 10/11, 64-bit |
            | `QuadStickConfigManager-macOS-AppleSilicon.zip` | Mac with Apple Silicon (M1/M2/M3/M4) |
            | `QuadStickConfigManager-macOS-Intel.zip` | Intel Mac |
            | `QuadStickConfigManager-Linux-x64.tar.gz` | Linux, 64-bit |

            **Windows:** SmartScreen may warn on first launch (the app isn't code-signed). Click **More info -> Run anyway**.

            **macOS:** the app isn't notarized yet, so the first launch needs **right-click the app -> Open -> Open**. If macOS says it "is damaged", run this in Terminal, then open it:
            ```
            xattr -dr com.apple.quarantine "/Applications/QuadStick Config Manager.app"
            ```
