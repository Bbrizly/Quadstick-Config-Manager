name: Rewrite one-shot format

on:
  push:
    branches:
      - rewrite/task41-device-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rewrite/task41-device-ui
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format Rust exactly as CI expects
        run: cargo +1.98.0 fmt --all
      - name: Commit formatter output only on rewrite branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "rewrite/task41-device-ui"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git diff --cached --check
          git commit -m "style(rewrite): apply pinned rustfmt"
          git push origin HEAD:rewrite/task41-device-ui
