name: Rewrite TASK-038 patch temporary

on:
  push:
    branches:
      - rewrite/task38-editor
    paths:
      - scripts/task38_patch_tmp.py
      - .github/workflows/rewrite-task38-patch-tmp.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rewrite/task38-editor
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact TASK-038 patch
        run: python3 scripts/task38_patch_tmp.py
      - name: Reject whitespace damage
        run: git diff --check
      - name: Commit coherent editor slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(rewrite): wire canonical editor vertical slice'
          git push origin HEAD:rewrite/task38-editor
