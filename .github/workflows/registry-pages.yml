name: Deploy Adaptive Profiles

on:
  push:
    branches: [main]
    paths: ["registry/**", "site/**", ".github/workflows/registry-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/registry/validate.mjs --check
      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp -R site/. _site/
          cp registry/index.json _site/data/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
